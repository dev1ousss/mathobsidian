<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590"><rect width="100%" height="100%" fill="white"/><text x="500.00" y="43.00" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="24" fill="#28384e">Две основные формы механической энергии</text><line x1="60.00" y1="67.00" x2="940.00" y2="67.00" stroke="#e2eaf1" stroke-width="2" stroke-linecap="round"/><rect x="105" y="180" width="360" height="245" rx="9" fill="#edf4fb" stroke="#97adc0" stroke-width="2"/><rect x="535" y="180" width="360" height="245" rx="9" fill="#edf7ef" stroke="#97adc0" stroke-width="2"/><text x="285.00" y="233.00" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="25" fill="#277dbd">Кинетическая</text><text x="285.00" y="276.00" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="21" fill="#28384e">Движение тела</text><text x="285.00" y="343.00" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="25" fill="#28384e">Ek = mv² / 2</text><text x="715.00" y="233.00" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="25" fill="#16846c">Потенциальная</text><text x="715.00" y="276.00" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="20" fill="#28384e">Положение и деформация</text><text x="715.00" y="343.00" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="25" fill="#28384e">Ep = mgh</text><text x="500.00" y="486.00" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="23" fill="#28384e">Механическая энергия E = Ek + Ep</text></svg>
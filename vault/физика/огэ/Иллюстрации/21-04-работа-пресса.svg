<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590"><rect width="100%" height="100%" fill="#ffffff"/><text x="500.00" y="43.00" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="25" fill="#263b52">Идеальный пресс не создаёт дополнительную энергию</text><line x1="65.00" y1="63.00" x2="935.00" y2="63.00" stroke="#e3ebf2" stroke-width="2" stroke-linecap="round"/><rect x="90" y="185" width="370" height="230" rx="7" fill="#edf4fb" stroke="#9bb2c5" stroke-width="2"/><rect x="540" y="185" width="370" height="230" rx="7" fill="#eef8f1" stroke="#9bb2c5" stroke-width="2"/><text x="275.00" y="233.00" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="24" fill="#287ec5">Малый поршень</text><text x="275.00" y="305.00" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="22" fill="#263b52">F1 = 100 Н</text><text x="275.00" y="350.00" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="22" fill="#263b52">s1 = 40 см</text><text x="725.00" y="233.00" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="24" fill="#19846f">Большой поршень</text><text x="725.00" y="305.00" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="22" fill="#263b52">F2 = 1000 Н</text><text x="725.00" y="350.00" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="22" fill="#263b52">s2 = 4 см</text><text x="500.00" y="475.00" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="20" fill="#263b52">Работа: 100·0,40 = 1000·0,04 = 40 Дж</text><text x="500.00" y="550.00" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="19" fill="#263b52">В идеальной модели A1 = A2</text></svg>
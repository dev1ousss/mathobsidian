<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590"><rect width="1000" height="590" fill="white"/><text x="500" y="43" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" fill="#293B50">Преобразование механической энергии</text><line x1="60" y1="67" x2="940" y2="67" stroke="#E0E9F1" stroke-width="2" stroke-linecap="round"/><rect x="88" y="179" width="389" height="307" rx="11" fill="#EDF5FC" stroke="#A3B6C7" stroke-width="2"/><rect x="522" y="179" width="389" height="307" rx="11" fill="#E8F5EF" stroke="#A3B6C7" stroke-width="2"/><text x="281" y="223" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" fill="#293B50">На высоте h</text><text x="718" y="223" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" fill="#293B50">Внизу</text><text x="281" y="314" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="29" fill="#19876A">Eп = mgh</text><text x="281" y="373" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" fill="#287DC4">Eк = 0</text><text x="718" y="314" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" fill="#19876A">Eп = 0</text><text x="718" y="373" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="29" fill="#287DC4">Eк = mgh</text><line x1="484" y1="329" x2="511" y2="329" stroke="#DA7D3B" stroke-width="5" stroke-linecap="round"/><polygon points="511,329 496.0,335.0 496.0,323.0" fill="#DA7D3B"/><text x="500" y="521" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#293B50">При отсутствии потерь Eп + Eк = const</text></svg>
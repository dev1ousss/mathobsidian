<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590"><rect width="1000" height="590" fill="white"/><text x="500.00" y="43.00" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" fill="#2B3E52">Изменение A и Z при ядерных превращениях</text><line x1="60.00" y1="67.00" x2="940.00" y2="67.00" stroke="#E2EAF2" stroke-width="2" stroke-linecap="round"/><rect x="100" y="175" width="355" height="289" rx="9" fill="#FAE6DC" stroke="#9AAFC2" stroke-width="2"/><rect x="545" y="175" width="355" height="289" rx="9" fill="#E7F4ED" stroke="#9AAFC2" stroke-width="2"/><text x="277.00" y="223.00" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" fill="#DC7A37">Альфа-распад</text><text x="722.00" y="223.00" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" fill="#19856C">Бета-минус-распад</text><text x="277.00" y="300.00" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" fill="#2B3E52">A → A − 4</text><text x="277.00" y="361.00" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" fill="#2B3E52">Z → Z − 2</text><text x="722.00" y="300.00" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" fill="#2B3E52">A → A</text><text x="722.00" y="361.00" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" fill="#2B3E52">Z → Z + 1</text><text x="500.00" y="506.00" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#2B3E52">В ядерных уравнениях сохраняются заряд и число нуклонов</text></svg>
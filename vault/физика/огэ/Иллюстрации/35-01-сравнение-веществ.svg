<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590"><rect width="100%" height="100%" fill="white"/><text x="500.0" y="43.0" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="24" fill="#293b50">Одинаковое количество теплоты — разный нагрев</text><line x1="60.0" y1="66.0" x2="940.0" y2="66.0" stroke="#e2ebf2" stroke-width="2" stroke-linecap="round"/><rect x="100" y="185" width="350" height="260" rx="9" fill="#d6eafa" stroke="#9db3c5" stroke-width="2"/><rect x="550" y="185" width="350" height="260" rx="9" fill="#f8e6d6" stroke="#9db3c5" stroke-width="2"/><text x="275.0" y="242.0" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="28" fill="#287dc5">Вода</text><text x="275.0" y="300.0" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="22" fill="#293b50">m = 1 кг</text><text x="275.0" y="345.0" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="22" fill="#293b50">Q = 8400 Дж</text><text x="275.0" y="399.0" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="25" fill="#287dc5">Δt = 2 °C</text><text x="725.0" y="242.0" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="28" fill="#da7b3b">Медь</text><text x="725.0" y="300.0" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="22" fill="#293b50">m = 1 кг</text><text x="725.0" y="345.0" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="22" fill="#293b50">Q = 8400 Дж</text><text x="725.0" y="399.0" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="25" fill="#da7b3b">Δt = 21 °C</text><text x="500.0" y="552.0" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="18" fill="#293b50">Чем больше удельная теплоёмкость, тем меньше Δt при равных m и Q</text></svg>
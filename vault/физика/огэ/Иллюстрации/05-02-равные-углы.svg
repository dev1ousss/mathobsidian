<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610"><rect width="100%" height="100%" fill="white"/><text x="500" y="45" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="26" fill="#24384f">Равные угловые перемещения за равное время</text><circle cx="500" cy="315" r="165" fill="none" stroke="#8b9aac" stroke-width="3"/><circle cx="500" cy="315" r="5" fill="#24384f"/><line x1="500" y1="315" x2="665" y2="315" stroke="#bdcbd9" stroke-width="2" stroke-dasharray="6 5"/><circle cx="665" cy="315" r="11" fill="#287cc6"/><text x="690" y="343" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="19" fill="#287cc6">t = 0</text><line x1="500" y1="315" x2="500" y2="150" stroke="#bdcbd9" stroke-width="2" stroke-dasharray="6 5"/><circle cx="500" cy="150" r="11" fill="#18856d"/><text x="518" y="132" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="19" fill="#18856d">t = T/4</text><line x1="500" y1="315" x2="335" y2="315" stroke="#bdcbd9" stroke-width="2" stroke-dasharray="6 5"/><circle cx="335" cy="315" r="11" fill="#8957b1"/><text x="305" y="342" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="19" fill="#8957b1">t = T/2</text><line x1="500" y1="315" x2="500" y2="480" stroke="#bdcbd9" stroke-width="2" stroke-dasharray="6 5"/><circle cx="500" cy="480" r="11" fill="#dc793c"/><text x="533" y="510" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="19" fill="#dc793c">t = 3T/4</text><text x="500" y="557" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="20" fill="#24384f">За каждый промежуток T/4 тело поворачивается на 90°</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#1976d2"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="500" y="48" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="26" fill="#263b54">Относительная скорость: одно направление</text><text x="500" y="112" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="20" fill="#263b54">Оба тела движутся вправо</text><line x1="100" y1="200" x2="900" y2="200" stroke="#ccd7e2" stroke-width="3" stroke-linecap="round"/><circle cx="195" cy="200" r="20" fill="#1976d2"/><line x1="220" y1="200" x2="700" y2="200" stroke="#1976d2" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><text x="460" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="20" fill="#263b54">A: vA = +12 м/с</text><line x1="100" y1="350" x2="900" y2="350" stroke="#ccd7e2" stroke-width="3" stroke-linecap="round"/><circle cx="195" cy="350" r="20" fill="#e37036"/><line x1="220" y1="350" x2="540" y2="350" stroke="#1976d2" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><text x="410" y="330" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="20" fill="#263b54">B: vB = +8 м/с</text><text x="500" y="455" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="26" fill="#263b54">vA/B = 12 - 8 = +4 м/с</text><text x="500" y="500" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="19" fill="#263b54">Тело A удаляется от B вправо со скоростью 4 м/с</text></svg>
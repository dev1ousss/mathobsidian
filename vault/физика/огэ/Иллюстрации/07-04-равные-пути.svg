<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><rect width="100%" height="100%" fill="white"/><text x="480.0" y="39.0" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="23" fill="#253b53">Равные расстояния не означают равные времена</text><rect x="90" y="185" width="365" height="95" rx="12" fill="#e7f0fb" stroke="#94abc0" stroke-width="2"/><rect x="505" y="185" width="365" height="95" rx="12" fill="#eaf6ef" stroke="#94abc0" stroke-width="2"/><text x="272.0" y="220.0" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="19" fill="#253b53">120 м со скоростью 4 м/с</text><text x="687.0" y="220.0" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="19" fill="#253b53">120 м со скоростью 6 м/с</text><text x="272.0" y="256.0" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="21" fill="#287dc5">30 секунд</text><text x="687.0" y="256.0" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="21" fill="#17846d">20 секунд</text><text x="480.0" y="380.0" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="21" fill="#253b53">Весь путь 240 м, всё время 50 с</text><text x="480.0" y="426.0" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="23" fill="#253b53">Средняя скорость: 240 / 50 = 4,8 м/с</text></svg>
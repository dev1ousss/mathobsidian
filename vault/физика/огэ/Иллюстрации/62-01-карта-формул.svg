<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590"><rect width="1000" height="590" fill="white"/><text x="500.00" y="43.00" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" fill="#293B50">Четыре главные группы формул ядерной физики</text><line x1="62.00" y1="67.00" x2="938.00" y2="67.00" stroke="#E2EAF2" stroke-width="2" stroke-linecap="round"/><rect x="70" y="142" width="403" height="162" rx="10" fill="#EEF4FA" stroke="#9AAFC2" stroke-width="2"/><rect x="526" y="142" width="403" height="162" rx="10" fill="#E7F4ED" stroke="#9AAFC2" stroke-width="2"/><rect x="70" y="332" width="403" height="160" rx="10" fill="#FBE9DD" stroke="#9AAFC2" stroke-width="2"/><rect x="526" y="332" width="403" height="160" rx="10" fill="#EEF4FA" stroke="#9AAFC2" stroke-width="2"/><text x="271.00" y="187.00" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#293B50">Строение ядра</text><text x="271.00" y="248.00" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="31" fill="#287DC4">A = Z + N</text><text x="727.00" y="187.00" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#293B50">Радиоактивный распад</text><text x="727.00" y="248.00" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" fill="#19856C">N = N₀ · 2⁻ᵗ/ᵀ</text><text x="271.00" y="382.00" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#293B50">Энергия связи</text><text x="271.00" y="444.00" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="31" fill="#DB7938">E = Δmc²</text><text x="727.00" y="382.00" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" fill="#293B50">Активность</text><text x="727.00" y="444.00" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="29" fill="#8558B4">Aакт = λN</text><text x="500.00" y="547.00" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#293B50">В решении всегда уточняй физический смысл символов</text></svg>
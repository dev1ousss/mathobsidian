<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590"><rect width="1000" height="590" fill="white"/><text x="500.00" y="43.00" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" fill="#293B50">Как меняются массовое и зарядовое числа</text><line x1="62.00" y1="67.00" x2="938.00" y2="67.00" stroke="#E2EAF2" stroke-width="2" stroke-linecap="round"/><rect x="86" y="168" width="396" height="305" rx="10" fill="#FBE9DD" stroke="#9AAFC2" stroke-width="2"/><rect x="519" y="168" width="396" height="305" rx="10" fill="#E7F4ED" stroke="#9AAFC2" stroke-width="2"/><text x="285.00" y="219.00" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" fill="#DB7938">Альфа-распад</text><text x="716.00" y="219.00" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" fill="#19856C">Бета-минус-распад</text><text x="285.00" y="290.00" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="28" fill="#293B50">A → A − 4</text><text x="285.00" y="354.00" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="28" fill="#293B50">Z → Z − 2</text><text x="716.00" y="290.00" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="28" fill="#293B50">A → A</text><text x="716.00" y="354.00" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="28" fill="#293B50">Z → Z + 1</text><text x="285.00" y="418.00" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#293B50">Испускается ядро гелия</text><text x="716.00" y="418.00" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#293B50">Испускаются e⁻ и антинейтрино</text><text x="500.00" y="547.00" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#293B50">В ядерных уравнениях сохраняются заряд и число нуклонов</text></svg>
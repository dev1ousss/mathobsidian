<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590"><rect width="100%" height="100%" fill="white"/><text x="500.00" y="43.00" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="24" fill="#28394e">Работа и мощность — разные величины</text><line x1="65.00" y1="65.00" x2="935.00" y2="65.00" stroke="#e2eaf2" stroke-width="2" stroke-linecap="round"/><rect x="95" y="175" width="365" height="260" rx="9" fill="#edf4fb" stroke="#9bafc4" stroke-width="2"/><rect x="540" y="175" width="365" height="260" rx="9" fill="#eef7ef" stroke="#9bafc4" stroke-width="2"/><text x="277.00" y="218.00" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="24" fill="#28394e">Работа</text><text x="723.00" y="218.00" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="24" fill="#28394e">Мощность</text><text x="277.00" y="292.00" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="22" fill="#28394e">Джоуль (Дж)</text><text x="723.00" y="292.00" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="22" fill="#28394e">Ватт (Вт)</text><text x="277.00" y="364.00" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="23" fill="#287dc5">A = Fs</text><text x="723.00" y="364.00" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="23" fill="#19866d">P = A / t</text><text x="500.00" y="490.00" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="23" fill="#28394e">1 Вт = 1 Дж/с</text><text x="500.00" y="556.00" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="19" fill="#28394e">Работа — количество передачи энергии; мощность — её темп.</text></svg>
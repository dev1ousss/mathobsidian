<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#1976d2"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="500" y="48" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="26" fill="#263b54">Относительная скорость: встречное движение</text><text x="500" y="110" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="20" fill="#263b54">Тела движутся навстречу друг другу</text><line x1="100" y1="270" x2="900" y2="270" stroke="#ccd7e2" stroke-width="3" stroke-linecap="round"/><circle cx="195" cy="270" r="20" fill="#1976d2"/><circle cx="805" cy="270" r="20" fill="#e37036"/><line x1="225" y1="270" x2="480" y2="270" stroke="#1976d2" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="775" y1="300" x2="570" y2="300" stroke="#e37036" stroke-width="6" stroke-linecap="round"/><text x="325" y="235" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="20" fill="#263b54">A: +10 м/с</text><text x="675" y="235" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="20" fill="#263b54">B: -6 м/с</text><text x="500" y="410" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="26" fill="#263b54">vA/B = 10 - (-6) = 16 м/с</text><text x="500" y="468" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="20" fill="#263b54">Расстояние сокращается на 16 м каждую секунду</text></svg>
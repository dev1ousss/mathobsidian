<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580"><rect width="100%" height="100%" fill="#ffffff"/><text x="500.00" y="45.00" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="25" fill="#263b53">Проекции силы под углом 30 градусов</text><circle cx="255" cy="425" r="7" fill="#263b53"/><line x1="255.00" y1="425.00" x2="688.00" y2="425.00" stroke="#287dc5" stroke-width="5" stroke-linecap="round"/><polygon points="688.00,425.00 673.00,431.00 673.00,419.00" fill="#287dc5"/><line x1="255.00" y1="425.00" x2="255.00" y2="175.00" stroke="#dc7b3d" stroke-width="5" stroke-linecap="round"/><polygon points="255.00,175.00 261.00,190.00 249.00,190.00" fill="#dc7b3d"/><line x1="255.00" y1="425.00" x2="688.00" y2="175.00" stroke="#19866f" stroke-width="6" stroke-linecap="round"/><polygon points="688.00,175.00 678.01,187.70 672.01,177.30" fill="#19866f"/><line x1="688.00" y1="175.00" x2="688.00" y2="425.00" stroke="#e4ebf2" stroke-width="2" stroke-linecap="round"/><line x1="255.00" y1="175.00" x2="688.00" y2="175.00" stroke="#e4ebf2" stroke-width="2" stroke-linecap="round"/><text x="470.00" y="453.00" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="19" fill="#287dc5">Fx = F cos(alpha)</text><text x="168.00" y="280.00" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="19" fill="#dc7b3d">Fy = F sin(alpha)</text><text x="580.00" y="265.00" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="25" fill="#19866f">F</text><text x="370.00" y="409.00" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="19" fill="#263b53">alpha = 30°</text><text x="500.00" y="535.00" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="19" fill="#263b53">При F = 10 Н: Fx = 8,66 Н; Fy = 5 Н</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590"><rect width="1000" height="590" fill="white"/><text x="500.00" y="43.00" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" fill="#29394E">При одинаковом токе P = I²R</text><line x1="65.00" y1="67.00" x2="935.00" y2="67.00" stroke="#E2EAF2" stroke-width="2" stroke-linecap="round"/><rect x="92" y="185" width="390" height="274" rx="10" fill="#EDF4FA" stroke="#9CB1C4" stroke-width="2"/><rect x="518" y="185" width="390" height="274" rx="10" fill="#EAF5EF" stroke="#9CB1C4" stroke-width="2"/><text x="287.00" y="236.00" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" fill="#29394E">Резистор 1</text><text x="714.00" y="236.00" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" fill="#29394E">Резистор 2</text><text x="287.00" y="300.00" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" fill="#29394E">R1 = 3 Ом</text><text x="714.00" y="300.00" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" fill="#29394E">R2 = 6 Ом</text><text x="287.00" y="364.00" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" fill="#287FC3">P1 = 12 Вт</text><text x="714.00" y="364.00" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" fill="#18846B">P2 = 24 Вт</text><text x="500.00" y="498.00" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#29394E">Последовательная цепь: ток через оба I = 2 А</text><text x="500.00" y="552.00" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#29394E">В последовательной цепи резистор с большим R выделяет большую мощность</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590"><rect width="100%" height="100%" fill="white"/><text x="500.00" y="43.00" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="24" fill="#28384e">Механическая энергия уменьшается из-за трения</text><line x1="60.00" y1="67.00" x2="940.00" y2="67.00" stroke="#e2eaf1" stroke-width="2" stroke-linecap="round"/><rect x="145" y="225" width="285" height="215" rx="9" fill="#edf4fb" stroke="#97adc0" stroke-width="2"/><rect x="570" y="225" width="285" height="215" rx="9" fill="#eaf7ef" stroke="#97adc0" stroke-width="2"/><text x="285.00" y="273.00" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="23" fill="#28384e">До скольжения</text><text x="285.00" y="340.00" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="22" fill="#28384e">Eмех = 120 Дж</text><text x="714.00" y="268.00" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="22" fill="#28384e">После скольжения</text><text x="714.00" y="330.00" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="22" fill="#16846c">Eмех = 90 Дж</text><text x="714.00" y="385.00" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="21" fill="#d57a38">Q = 30 Дж</text><line x1="432.00" y1="330.00" x2="565.00" y2="330.00" stroke="#d57a38" stroke-width="5" stroke-linecap="round"/><polygon points="565.00,330.00 550.00,336.00 550.00,324.00" fill="#d57a38"/><text x="500.00" y="550.00" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="18" fill="#28384e">При отсутствии других потерь: Eнач = Eкон + Q</text></svg>
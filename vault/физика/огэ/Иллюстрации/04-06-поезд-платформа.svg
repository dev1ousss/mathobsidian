<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#1976d2"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="500" y="48" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="26" fill="#263b54">Полное прохождение поезда мимо платформы</text><text x="500" y="110" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="20" fill="#263b54">Чтобы поезд полностью миновал платформу,</text><text x="500" y="145" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="20" fill="#263b54">его передняя часть должна пройти L + l</text><rect x="100" y="235" width="310" height="120" rx="12" fill="#e1efff" stroke="#a8bfd8" stroke-width="2"/><text x="255" y="302" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="20" fill="#263b54">Поезд: L = 120 м</text><rect x="450" y="360" width="440" height="55" rx="12" fill="#e3f4e7" stroke="#a8bfd8" stroke-width="2"/><text x="670" y="396" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="20" fill="#263b54">Платформа: l = 180 м</text><line x1="95" y1="455" x2="905" y2="455" stroke="#9aaabc" stroke-width="4" stroke-linecap="round"/><line x1="415" y1="215" x2="770" y2="215" stroke="#1976d2" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><text x="592" y="194" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="20" fill="#263b54">v = 15 м/с</text><text x="500" y="510" text-anchor="middle" font-family="Arial,DejaVu Sans" font-size="24" fill="#263b54">t = (L + l) / v = 300 / 15 = 20 с</text></svg>
<svg xmlns="http://www.w3.org/2000/svg"
width="1000" height="720" viewBox="0 0 1000 720">

<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10"
          refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 Z" fill="#1976d2"/>
  </marker>
</defs>

<rect width="100%" height="100%" fill="white"/>

<text x="500" y="45" text-anchor="middle"
font-family="Arial" font-size="26" font-weight="bold"
fill="#23384f">
Как изменяется путь за каждую секунду
</text>

<text x="500" y="79" text-anchor="middle"
font-family="Arial" font-size="20" fill="#466078">
Падение без начальной скорости, g = 10 м/с²
</text>

<line x1="280" y1="125" x2="280" y2="620"
stroke="#9baabd" stroke-width="3"/>

<line x1="280" y1="620" x2="790" y2="620"
stroke="#9baabd" stroke-width="4"/>

<circle cx="280" cy="125" r="15" fill="#1976d2"/>
<circle cx="280" cy="180" r="15" fill="#1976d2"/>
<circle cx="280" cy="345" r="15" fill="#1976d2"/>
<circle cx="280" cy="620" r="15" fill="#1976d2"/>

<g font-family="Arial" font-size="22" fill="#243650">
  <text x="320" y="130">t = 0 с, путь = 0 м</text>
  <text x="320" y="185">t = 1 с, путь = 5 м</text>
  <text x="320" y="350">t = 2 с, путь = 20 м</text>
  <text x="320" y="625">t = 3 с, путь = 45 м</text>
</g>

<line x1="180" y1="125" x2="180" y2="180"
stroke="#178b74" stroke-width="7"/>

<line x1="180" y1="180" x2="180" y2="345"
stroke="#e46b32" stroke-width="7"/>

<line x1="180" y1="345" x2="180" y2="620"
stroke="#8a4ec2" stroke-width="7"/>

<g font-family="Arial" font-size="20">
  <text x="55" y="160" fill="#178b74">5 м</text>
  <text x="50" y="268" fill="#e46b32">15 м</text>
  <text x="50" y="480" fill="#8a4ec2">25 м</text>
</g>

<text x="500" y="690" text-anchor="middle"
font-family="Arial" font-size="22" fill="#243650">
За равные секунды пути относятся как 1 : 3 : 5
</text>
</svg>